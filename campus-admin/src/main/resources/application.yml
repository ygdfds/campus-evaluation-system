server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: campus-evaluation-system
  config:
    import: optional:file:.env[.properties]

  # Jackson 时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 文件上传大小限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

# Knife4j / Springdoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true
  is-read-cookie: false

# 文件存储
campus:
  storage:
    type: local
    local-path: ./uploads
    url-prefix: /upload
  token:
    prefix: Bearer
    expire-seconds: 86400
    header-name: Authorization
  security:
    default-password: "123456"
  ai:
    ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    request-timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
